repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint.yaml"]
        # Archived plans are frozen historical records, not live documents:
        # they carry the `_Stage:_` footers and list styles of the era they were
        # written in. `plans_lint` already exempts this directory for the same
        # reason; restyling them would rewrite history to satisfy a linter.
        exclude: ^docs/plans/archive/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff

  - repo: local
    hooks:
      - id: prevent-release-on-feature-branch
        name: Prevent release commits on feature branches
        entry: scripts/prevent-release-on-feature-branch.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: prevent-release-on-feature-branch-msg
        name: Prevent release commit messages on feature branches
        entry: scripts/prevent-release-on-feature-branch.sh
        language: script
        stages: [commit-msg]
