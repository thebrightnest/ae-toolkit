repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, yaml, json]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint.yaml"]

  - repo: local
    hooks:
      - id: prevent-release-on-feature-branch
        name: Prevent release commits on feature branches
        entry: scripts/prevent-release-on-feature-branch.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: prevent-release-on-feature-branch-msg
        name: Prevent release commit messages on feature branches
        entry: scripts/prevent-release-on-feature-branch.sh
        language: script
        stages: [commit-msg]
