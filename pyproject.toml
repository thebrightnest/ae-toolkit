[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aet"
version = "1.3.0"
description = "Agentic Engineering Toolkit CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.2",
    "filelock>=3.16,<4",
    "starlette>=0.40.0",
    "uvicorn>=0.32.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-xdist",
    "ruff",
]

[project.scripts]
aet = "aet.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aet"]
include = ["src/aet/workflows/*.json", "src/aet/panel/index.html"]
